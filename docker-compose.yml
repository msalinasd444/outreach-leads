services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      # La etapa con pytest y los tests. Sin target se construye la de producción.
      target: desarrollo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/outreach_test
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Vacías si no están en .env (así corre el CI). Con el worker activo, la app
      # no arranca sin GROQ_API_KEY y GROQ_MODEL.
      WORKER_ACTIVO: ${WORKER_ACTIVO:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-}
      GROQ_TIMEOUT: ${GROQ_TIMEOUT:-20}
      GROQ_RPM: ${GROQ_RPM:-10}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
